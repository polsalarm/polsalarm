name: Generate Profile Visuals

# One job builds every generated image and publishes them together to the
# `output` branch. ghaction-github-pages replaces that branch on each run, so
# separate workflows publishing there would delete each other's files.

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Runs first: checkout cleans the workspace, which would wipe dist/.
      - name: Checkout settings
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github

      - name: Generate snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/github-contribution-grid-snake.svg

      # Pinned to a main commit: the out-of-memory fix (upstream PR #19)
      # landed after the v5.0.0 release. continue-on-error keeps a flaky
      # Pac-Man run from blocking the other images.
      - name: Generate Pac-Man SVGs
        continue-on-error: true
        uses: abozanona/pacman-contribution-graph@70945878b1118303b37b88060fc7145e1a57d7b1
        with:
          github_user_name: ${{ github.repository_owner }}
          games: pacman

      # Built-in night-rainbow colors with a midnight-purple background.
      - name: Generate 3D contribution calendar
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: .github/profile-3d-contrib-settings.json

      - name: Collect 3D calendar into dist
        run: |
          mkdir -p dist/profile-3d-contrib
          cp profile-3d-contrib/*.svg dist/profile-3d-contrib/
          ls -R dist

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
